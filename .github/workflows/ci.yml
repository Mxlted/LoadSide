name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15 # Apple Silicon
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0 # Bundle build numbers use the complete commit count.
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          swift format --version
      - name: Test, build and smoke-test CLI
        run: scripts/check.sh
      - name: Package arm64 local build
        run: scripts/package.sh --local --archive --dmg
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LoadSide-local-arm64
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0 # Both distributable formats are already compressed.
