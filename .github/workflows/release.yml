name: Qualified release build
on:
  workflow_dispatch:
    inputs:
      device_qualification:
        description: 'URL of the completed device qualification issue for this exact commit'
        required: true
        type: string
      qualification_commit:
        description: 'Full commit SHA covered by the qualification issue; must equal the selected tag commit'
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    # Configure this protected environment on a trusted, dedicated Mac with
    # Developer ID + notarytool credentials in its keychain. No secrets on PRs.
    # Required environment reviewers must inspect the qualification issue and confirm
    # completion for the exact commit. URL/commit validation below does not prove completion.
    environment: production
    runs-on: [self-hosted, macOS, loadside-release]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require the version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF" == "refs/tags/v$(cat VERSION)" ]] || { echo 'Run from the matching version tag.'; exit 1; }
      - name: Validate qualification reference and exact commit
        shell: bash
        env:
          QUALIFICATION_REFERENCE: ${{ inputs.device_qualification }}
          QUALIFICATION_COMMIT: ${{ inputs.qualification_commit }}
        run: |
          [[ "$QUALIFICATION_COMMIT" == "$GITHUB_SHA" ]] || { echo 'Qualification commit must exactly match the selected tag commit.'; exit 1; }
          ISSUE_PREFIX="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/"
          [[ "$QUALIFICATION_REFERENCE" == "$ISSUE_PREFIX"* ]] || { echo 'Qualification URL must point to an issue in this repository.'; exit 1; }
          ISSUE_NUMBER="${QUALIFICATION_REFERENCE#"$ISSUE_PREFIX"}"
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Qualification URL must end with a valid issue number.'; exit 1; }
          echo 'Reference and commit validated. Qualification content and completion require protected environment reviewer approval.'
      - name: Verify
        run: scripts/check.sh
      - name: Sign, notarize and package
        env:
          LOADSIDE_SIGNING_IDENTITY: ${{ vars.LOADSIDE_SIGNING_IDENTITY }}
          LOADSIDE_NOTARY_PROFILE: ${{ vars.LOADSIDE_NOTARY_PROFILE }}
        run: scripts/package.sh --production
      - name: Record qualification reference
        env:
          QUALIFICATION_REFERENCE: ${{ inputs.device_qualification }}
          QUALIFICATION_COMMIT: ${{ inputs.qualification_commit }}
        run: |
          printf 'Commit: %s\nIssue: %s\n' "$QUALIFICATION_COMMIT" "$QUALIFICATION_REFERENCE" > dist/qualification-reference.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LoadSide-qualified-release
          path: dist/*
          if-no-files-found: error
          retention-days: 90
